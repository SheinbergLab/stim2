# Weston kiosk configuration for stim2 (used by stim2-weston.service on
# vendor-Mali-blob boards like the NXP i.MX95, where cage can't run).
# postinst seeds this to /etc/xdg/weston/stim2-kiosk.ini -- edit that copy.
#
# For high-refresh displays add e.g.:
#   [output]
#   name=HDMI-A-1
#   mode=1920x1080@100

[core]
shell=kiosk-shell.so
idle-time=0
require-input=false
use-g2d=true

[autolaunch]
path=/usr/local/stim2/stim2-kiosk.sh
watch=true
